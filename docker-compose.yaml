networks:
  app:
    driver: bridge
  edge:
    driver: bridge

# Shared wiring for the app containers (profile `apps`). Per-app settings come from the git-ignored
# apps/<app>/.env (copy the .env.example next to it); the infra hostnames/credentials below override the
# localhost values those files carry for host-run `pnpm dev`. Set POSTGRES_USER / POSTGRES_PASSWORD /
# MONGO_INITDB_ROOT_* (same values as docker/postgres.env and docker/mongo.env) in a root .env or the shell;
# the defaults match the *.env.example files. Nothing secret is baked into any image.
x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nestjs}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://redis:6379
  MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-nestjs}:${MONGO_INITDB_ROOT_PASSWORD:-change-me}@mongo:27017/${MONGO_INITDB_DATABASE:-nestjs}?authSource=admin
  PIM_S3_ENDPOINT: http://minio:9000
  PIM_S3_BUCKET: ${PIM_S3_BUCKET:-pim-media}
  PIM_S3_ACCESS_KEY: ${PIM_S3_ACCESS_KEY:-minioadmin}
  PIM_S3_SECRET_KEY: ${PIM_S3_SECRET_KEY:-minioadmin}

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  mongo:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # ---- Applications (opt-in: `docker compose --profile apps up -d --build`) -----------------------------------
  # Plain `docker compose up` still starts infrastructure only. Build context is the repo root; each image is
  # produced by apps/<app>/Dockerfile (turbo prune -> build -> prod-only runtime, non-root).

  # One-shot: applies prisma migrations (needs the prisma CLI, so it uses the Dockerfile's `migrate` stage).
  migrate:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: pim-migrate:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nestjs}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: 'no'

  api:
    profiles: [apps]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    image: pim-api:local
    restart: unless-stopped
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      <<: *app-environment
      PORT: '3100'
    ports:
      - '3100:3100'
    depends_on: *app-depends-on
    networks:
      - app

  worker:
    profiles: [apps]
    build: { context: ., dockerfile: apps/worker/Dockerfile, target: runtime }
    image: pim-worker:local
    restart: unless-stopped
    env_file:
      - path: ./apps/worker/.env
        required: false
    environment:
      <<: *app-environment
      PORT: '3400'
    ports:
      - '3400:3400'
    depends_on: *app-depends-on
    networks:
      - app

  cron:
    profiles: [apps]
    build: { context: ., dockerfile: apps/cron/Dockerfile, target: runtime }
    image: pim-cron:local
    restart: unless-stopped
    env_file:
      - path: ./apps/cron/.env
        required: false
    environment:
      <<: *app-environment
      PORT: '3200'
    ports:
      - '3200:3200'
    depends_on: *app-depends-on
    networks:
      - app

  auth:
    profiles: [apps]
    build: { context: ., dockerfile: apps/auth/Dockerfile, target: runtime }
    image: pim-auth:local
    restart: unless-stopped
    env_file:
      - path: ./apps/auth/.env
        required: false
    environment:
      <<: *app-environment
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on: *app-depends-on
    networks:
      - app

  notifications:
    profiles: [apps]
    build: { context: ., dockerfile: apps/notifications/Dockerfile, target: runtime }
    image: pim-notifications:local
    restart: unless-stopped
    env_file:
      - path: ./apps/notifications/.env
        required: false
    environment:
      <<: *app-environment
      PORT: '3300'
    ports:
      - '3300:3300'
    depends_on: *app-depends-on
    networks:
      - app

  # nginx (unprivileged, 8080): Angular static build + same-origin /api/ proxy to api:3100.
  web:
    profiles: [apps]
    build: { context: ., dockerfile: apps/web/Dockerfile, target: runtime }
    image: pim-web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3100
    ports:
      - '8080:8080'
    depends_on:
      - api
    networks:
      - app

  # ---- Infrastructure ------------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.tmp/prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - app

  grafana:
    image: grafana/grafana:12.0.1
    restart: unless-stopped
    ports:
      - '3333:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.tmp/grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    ports:
      # Host port 3100 is taken by apps/api (see ecosystem.config.js) — Loki's
      # container-internal port stays 3100, only the host mapping moves.
      - '3101:3100'
    volumes:
      - ./.tmp/loki-data:/loki
    networks:
      - app

  # Tails the PM2-managed apps' log files (./logs, see ecosystem.config.js)
  # and ships them to Loki. Nothing to tail in local dev, where apps run via
  # `pnpm dev` on the host instead of under PM2 — harmless no-op until then.
  alloy:
    image: grafana/alloy:v1.15.0
    restart: unless-stopped
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/app:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    networks:
      - app
    depends_on:
      - loki

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./docker/postgres.env
    ports:
      - '5432:5432'
    volumes:
      - ./.tmp/postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjs']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  # S3-compatible object storage for product images (NFR-07, FR-ENR-001). Path-style addressing, which is what
  # S3ObjectStorage in @repo/pim-runtime uses. Local dev only: the default credentials below are MinIO's well-known
  # development defaults, override them through the shell or a git-ignored .env (PIM_S3_* must match).
  # Images: MinIO no longer publishes to Docker Hub, so the default is quay.io; pin a tag or point
  # PIM_MINIO_IMAGE / PIM_MINIO_MC_IMAGE at your own mirror.
  minio:
    image: ${PIM_MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API  -> PIM_S3_ENDPOINT=http://localhost:9000
      - '9001:9001' # web console
    environment:
      MINIO_ROOT_USER: ${PIM_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PIM_S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./.tmp/minio-data:/data
    networks:
      - app
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: creates the image bucket and makes objects publicly readable (channels download images from
  # PIM_S3_PUBLIC_BASE_URL / <endpoint>/<bucket>, never from AW hotlinks). Idempotent, exits when done.
  minio-init:
    image: ${PIM_MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${PIM_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PIM_S3_SECRET_KEY:-minioadmin}
      PIM_S3_BUCKET: ${PIM_S3_BUCKET:-pim-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$PIM_S3_BUCKET &&
      mc anonymous set download local/$$PIM_S3_BUCKET &&
      echo bucket $$PIM_S3_BUCKET ready"
    networks:
      - app
    restart: 'no'

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    env_file:
      - ./docker/mongo.env
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --eval ''db.runCommand("ping")'' --quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
